<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="vehicle-hud" id="vehicle-hud" style="display: none;">
        <div class="speedometer">
            
            <svg class="gauges" viewBox="0 0 200 200" style="overflow: visible;">
                <defs>
                    <mask id="rpm-mask">
                        <path fill="none" stroke="white" stroke-width="12" stroke-dasharray="16 2" 
                              d="M 27.3,142.0 A 84,84 0 1,1 172.7,142.0" />
                    </mask>
                    <linearGradient id="gas-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="25%" stop-color="#ffffff" />
                        <stop offset="25.1%" stop-color="#ffff00" />
                        <stop offset="75%" stop-color="#ffff00" />
                        <stop offset="75.1%" stop-color="#ff0000" />
                        <stop offset="100%" stop-color="#ff0000" />
                    </linearGradient>
                    <linearGradient id="elec-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00d0ff" />
                        <stop offset="100%" stop-color="#0055ff" />
                    </linearGradient>
                </defs>
                
                <!-- RPM Background (Empty Dashes) -->
                <path class="rpm-bg" mask="url(#rpm-mask)" d="M 27.3,142.0 A 84,84 0 1,1 172.7,142.0" />
                
                <!-- RPM Foreground (Colored Dashes) -->
                <path class="rpm-fg" mask="url(#rpm-mask)" id="rpm-path" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" 
                      d="M 27.3,142.0 A 84,84 0 1,1 172.7,142.0" style="stroke: url(#gas-grad); stroke-width: 12;" />

                <!-- Outer Bracket for Fuel -->
                <path fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" d="M 219.8,40.0 A 134,134 0 0,1 219.8,160.0" />

                <!-- FUEL Arc (r=98, solid, from bottom to top) -->
                <path class="fuel-bg" fill="none" stroke="rgba(40,40,40,0.9)" stroke-width="8" stroke-linecap="butt" d="M 187.0,145.0 A 98,98 0 0,0 156.6,20.0" />
                <path class="fuel-fg" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="butt" id="fuel-path" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" 
                      d="M 187.0,145.0 A 98,98 0 0,0 156.6,20.0" />
            </svg>
            
            <div class="speed-center">
                <div class="gear-circle">
                    <span id="veh-gear">D</span>
                </div>
                <span class="gear-label">GEAR</span>
                <div class="speed-value-container">
                    <div class="speed-value" id="veh-speed">
                        <span class="faded-zero">0</span><span class="faded-zero">0</span>1
                    </div>
                </div>
                <div class="speed-unit">MPH</div>
            </div>
            
            <div class="fuel-icon-overlay" id="icon-fuel">
                <i class="fa-solid fa-gas-pump" id="fuel-type-icon"></i>
                <i class="fa-solid fa-caret-right" style="font-size: 8px; margin-left: 2px;"></i>
            </div>

            <!-- Right side stacked icons -->
            <div class="veh-icons">
                <div class="v-icon" id="icon-lights"><i class="fa-regular fa-lightbulb"></i></div>
                <div class="v-icon" id="icon-seatbelt"><i class="fa-solid fa-user-slash"></i></div>
                <div class="v-icon" id="icon-lock"><i class="fa-solid fa-unlock"></i></div>
            </div>
        </div>
    </div>
    
    <div class="center-container" id="engine-container" style="display: none;">
        <div class="center-bar-wrapper">
            <i class="fa-solid fa-car-burst center-icon" id="engine-icon"></i>
            <div class="center-track">
                <div class="center-fill" id="engine-fill"></div>
            </div>
        </div>
    </div>

    </script>
</body>
</html>
