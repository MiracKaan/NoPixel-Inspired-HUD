<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="compass-container" id="compass-container" style="display:none;">
        <div class="compass-degree"><span id="degree">240</span>&deg;</div>
        
        <div class="map-ring">
            <div class="mapborder"></div>
            <div class="compass-letters" id="compass-letters">
                <div class="letter n">N</div>
                <div class="letter e">E</div>
                <div class="letter s">S</div>
                <div class="letter w">W</div>
            </div>
        </div>

        <div class="location-info">
            <div class="zone" id="zone">GALILEE</div>
            <div class="street" id="street">NORTH CALAFIA WAY</div>
        </div>
    </div>
    
    <div id="safezone-warning" style="display:none; position:absolute; top:0; left:0; width:100vw; height:100vh; background:rgba(15,15,15,0.95); z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white; font-family:'Montserrat', sans-serif;">
        <div style="font-size: 80px; color: #e74c3c; margin-bottom: 20px;">⚠️</div>
        <h1 style="font-size: 40px; margin-bottom: 15px; text-transform: uppercase;">Safezone Size Hatalı!</h1>
        <p style="font-size: 20px; text-align: center; line-height: 1.5; font-weight: 500;">Haritanın ve UI'ın düzgün çalışması için lütfen:<br><br>
        <span style="background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 5px; font-weight: 800;">ESC > Settings > Display > Safezone Size</span><br><br>
        ayarını fareyle tutarak <strong>en sağa (sonuna kadar)</strong> çekin.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
