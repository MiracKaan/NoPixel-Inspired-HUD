<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container" style="display:none;" id="hud">
        
        <div class="mic-wrapper">
            <div class="mic-container" id="mic-bg">
                <i class="fa-solid fa-microphone" id="mic-icon"></i>
            </div>
        </div>

        <div class="hud-separator"></div>

        <div class="stats-container">
            <div class="bars-row">
                <!-- Health Column -->
                <div class="bar-column">
                    <div class="bar-wrapper health-wrapper">
                        <div class="bar-fill" id="health-fill"></div>
                        <div class="bar-content">
                            <i class="fa-solid fa-heart-pulse"></i>
                            <span>HEALTH</span>
                        </div>
                    </div>
                    <div class="sub-bar-container">
                        <div class="sub-bar-track">
                            <div class="sub-bar-fill" id="hunger-fill"></div>
                        </div>
                        <div class="sub-icon-bg">
                            <i class="fa-solid fa-burger sub-icon" id="hunger-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- Armor Column -->
                <div class="bar-column">
                    <div class="bar-wrapper armor-wrapper">
                        <div class="bar-fill" id="armor-fill"></div>
                        <div class="bar-content">
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>ARMOR</span>
                        </div>
                    </div>
                    <div class="sub-bar-container">
                        <div class="sub-bar-track">
                            <div class="sub-bar-fill" id="thirst-fill"></div>
                        </div>
                        <div class="sub-icon-bg">
                            <i class="fa-solid fa-droplet sub-icon" id="thirst-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="hud-separator" id="status-separator" style="display: none;"></div>

        <div class="status-icons-wrapper">
            <div class="status-icon-circle bleed-circle" id="bleed-container" style="display: none;">
                <i class="fa-solid fa-droplet"></i>
            </div>

            <div class="status-icon-circle bone-circle" id="bone-container" style="display: none;">
                <i class="fa-solid fa-bone"></i>
            </div>

            <div class="status-icon-circle stress-circle" id="stress-bg" style="display: none;">
                <i class="fa-solid fa-brain" id="stress-icon"></i>
            </div>

            <div class="status-icon-circle devmode-circle" id="devmode-container" style="display: none;">
                <i class="fa-solid fa-code"></i>
            </div>
        </div>

    </div>

    <div class="center-container">
        <div class="center-bar-wrapper" id="stamina-container" style="display:none;">
            <i class="fa-solid fa-person-running center-icon" id="stamina-icon"></i>
            <div class="center-track"><div class="center-fill" id="stamina-fill"></div></div>
        </div>
        <div class="center-bar-wrapper" id="oxygen-container" style="display:none;">
            <i class="fa-solid fa-person-swimming center-icon" id="oxygen-icon"></i>
            <div class="center-track"><div class="center-fill" id="oxygen-fill"></div></div>
        </div>
    </div>

    <div class="weapon-hud" id="weapon-container" style="display: none;">
        <i class="fa-solid fa-gun weapon-icon"></i>
        <div class="ammo-clip" id="ammo-clip">0</div>
        <div class="ammo-sep">|</div>
        <div class="ammo-total" id="ammo-total">0</div>
    </div>

    <div class="custom-crosshair" id="crosshair" style="display: none;">
        <div class="crosshair-dot"></div>
    </div>

    <!-- Cinematic Bars -->
    <div class="cinematic-bar top-bar" id="cinematic-top"></div>
    <div class="cinematic-bar bottom-bar" id="cinematic-bottom"></div>

            <!-- Top Left Player Info HUD -->
    <div class="player-info-hud" id="player-info-hud" style="display:none;">
        <div class="pi-id" id="player-id">1</div>
        <div class="pi-content">
            <div class="pi-name" id="player-name">MARK MITCHELL</div>
            <div class="pi-job" id="player-job">CIVILIAN - FREELANCER</div>
            <div class="pi-money">
                <div class="money-badge cash-badge">
                    <i class="fa-solid fa-money-bill"></i>
                    <span id="player-cash"><!-- Top Left Player Info HUD -->
    <div class="player-info-hud" id="player-info-hud" style="display:none;">
        <div class="pi-header">
            <div class="pi-id" id="player-id">1</div>
            <div class="pi-name" id="player-name">MARK MITCHELL</div>
        </div>
        <div class="pi-job" id="player-job">CIVILIAN - FREELANCER</div>
        <div class="pi-money">
            <div class="money-badge cash-badge">
                <i class="fa-solid fa-money-bill"></i>
                <span id="player-cash">$$0</span>
            </div>
            <div class="money-badge bank-badge">
                <i class="fa-solid fa-building-columns"></i>
                <span id="player-bank">$$0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script></span>
                </div>
                <div class="money-badge bank-badge">
                    <i class="fa-solid fa-building-columns"></i>
                    <span id="player-bank"><!-- Top Left Player Info HUD -->
    <div class="player-info-hud" id="player-info-hud" style="display:none;">
        <div class="pi-header">
            <div class="pi-id" id="player-id">1</div>
            <div class="pi-name" id="player-name">MARK MITCHELL</div>
        </div>
        <div class="pi-job" id="player-job">CIVILIAN - FREELANCER</div>
        <div class="pi-money">
            <div class="money-badge cash-badge">
                <i class="fa-solid fa-money-bill"></i>
                <span id="player-cash">$$0</span>
            </div>
            <div class="money-badge bank-badge">
                <i class="fa-solid fa-building-columns"></i>
                <span id="player-bank">$$0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
